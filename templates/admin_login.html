<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录 · {{ site_name }}</title>
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="login-body">
<main class="login-shell">
    <a class="login-back" href="/">← 返回赛季首页</a>
    <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">Admin</p>
        <h1 id="login-title">后台登录</h1>
        <p class="login-lead">账号、密码与图形验证码。连续失败将暂时锁定。</p>
        {% if error %}
        <div class="login-error" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login" autocomplete="username">
            <input type="hidden" name="next" value="{{ next }}">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" required autofocus maxlength="64" {% if locked %}disabled{% endif %}>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" required maxlength="128" {% if locked %}disabled{% endif %}>
            <label for="captcha">验证码</label>
            <div class="captcha-row">
                <input id="captcha" name="captcha" type="text" required maxlength="8" autocapitalize="characters" spellcheck="false" autocomplete="off" {% if locked %}disabled{% endif %}>
                <button type="button" class="captcha-btn" title="点击刷新验证码" onclick="refreshCaptcha()">
                    <img id="captchaImg" src="/admin/captcha" width="140" height="48" alt="验证码">
                </button>
            </div>
            <button type="submit" class="login-submit" {% if locked %}disabled{% endif %}>登录</button>
        </form>
    </section>
</main>
<script>
    function refreshCaptcha() {
        document.getElementById('captchaImg').src = '/admin/captcha?' + Date.now();
    }
</script>
</body>
</html>
