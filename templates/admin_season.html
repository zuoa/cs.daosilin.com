<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杯赛采集管理</title>
    <link href="/static/style.css" rel="stylesheet">
    <style>
        body { background: #0f1419; color: #e6e6e6; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .wrap { max-width: 1140px; margin: 0 auto; padding: 24px 16px 80px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        h2 { font-size: 16px; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #2a323d; color: #9fb3c8; }
        .muted { color: #7a8693; font-size: 13px; }
        .card { background: #161d26; border: 1px solid #232c38; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #232c38; vertical-align: middle; }
        th { color: #9fb3c8; font-weight: 600; }
        tr.current { background: #1e2a36; }
        input[type=text], input[type=number], select, textarea {
            background: #0f1419; border: 1px solid #2a323d; color: #e6e6e6;
            border-radius: 6px; padding: 7px 9px; font-size: 13px; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #3b6ea8; }
        textarea { width: 100%; min-height: 90px; resize: vertical; font-family: monospace; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .row > label { min-width: 70px; color: #9fb3c8; font-size: 13px; }
        .row > input[type=text], .row > input[type=number], .row > select { flex: 1; min-width: 110px; }
        button {
            background: #2b6cb0; color: #fff; border: none; border-radius: 6px;
            padding: 7px 14px; font-size: 13px; cursor: pointer;
        }
        button:hover { background: #357ac4; }
        button.ghost { background: #2a323d; }
        button.ghost:hover { background: #36424f; }
        button.danger { background: #8a3535; }
        button.danger:hover { background: #a14040; }
        button.sm { padding: 4px 10px; font-size: 12px; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
        .tag.custom { background: #3a2f1a; color: #d8b66a; }
        .tag.official { background: #1a2f3a; color: #6ab7d8; }
        .tag.active { background: #1f3a26; color: #6bd896; }
        .tag.archived { background: #3a2626; color: #d89696; }
        .hit { color: #6bd896; font-weight: 600; }
        .player.in { color: #6bd896; }
        .player { color: #9fb3c8; margin-right: 6px; }
        .actions { display: flex; gap: 6px; }
        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .empty { color: #7a8693; padding: 20px; text-align: center; }
        a.link { color: #4a90d9; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        .nav { display: flex; gap: 16px; margin: 8px 0 18px; font-size: 13px; }
        .nav a { color: #9fb3c8; text-decoration: none; }
        .nav a.on { color: #e6e6e6; font-weight: 600; }
        .picker { max-height: 220px; overflow: auto; border: 1px solid #232c38; border-radius: 8px; padding: 8px; margin-top: 8px; }
        .picker label { display: flex; gap: 8px; align-items: center; padding: 4px 2px; font-size: 13px; cursor: pointer; }
        .picker label:hover { background: #1e2a36; }
        .tabs { display: flex; gap: 0; margin-bottom: 10px; }
        .tabs button { border-radius: 6px 6px 0 0; background: #1a222c; }
        .tabs button.on { background: #2b6cb0; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1e2a36; border: 1px solid #2a323d; padding: 10px 18px; border-radius: 8px;
            display: none; font-size: 13px; z-index: 20; }
        .status-running { color: #d8b66a; }
        .status-done { color: #6bd896; }
        .status-error { color: #d89696; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>杯赛采集管理</h1>
    <div class="nav">
        <a class="on" href="/admin/season?auth={{ auth }}">杯赛 / 采集</a>
        <a href="/admin/players?auth={{ auth }}">玩家库</a>
    </div>
    <p class="muted">配置杯赛、时间段、种子玩家后采集。一场要算进杯赛，场内库内玩家占比需达到门槛（默认 60%）。采集后可剔除不要的局。</p>

    <h2>① 杯赛</h2>
    <div class="card">
        <table id="seasonTable">
            <thead>
            <tr>
                <th></th>
                <th>cup_name</th>
                <th>名称</th>
                <th>类型</th>
                <th>时间段</th>
                <th>门槛</th>
                <th>状态</th>
                <th>种子</th>
                <th>已纳入 / 已剔除</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="seasonEmpty" class="empty">暂无杯赛，先在下方新建</div>
    </div>

    <div class="card">
        <div class="row">
            <label>cup_name*</label><input type="text" id="f_cup" placeholder="唯一标识，如 内战S2">
            <label>名称</label><input type="text" id="f_name" placeholder="展示名">
            <label>类型</label>
            <select id="f_type"><option value="custom">custom 自定义</option><option value="official">official 官方杯名</option></select>
            <label>起</label><input type="text" id="f_start" placeholder="YYYYMMDD">
            <label>止</label><input type="text" id="f_end" placeholder="YYYYMMDD">
            <label>库内占比%</label><input type="number" id="f_hit" min="0" max="100" step="5" value="60">
            <label>状态</label>
            <select id="f_status"><option value="active">active</option><option value="archived">archived</option></select>
            <button onclick="saveSeason()">保存杯赛</button>
            <button class="ghost" onclick="clearSeasonForm()">清空</button>
        </div>
    </div>

    <h2>② 种子玩家 <span id="rosterTitle" class="muted"></span></h2>
    <div class="card">
        <div id="rosterList" class="muted">请先选择/新建一个杯赛</div>
        <div class="row" style="margin-top:12px;">
            <label>搜索玩家库</label>
            <input type="text" id="seedSearch" placeholder="ID / 昵称 / 别名" oninput="filterSeedPicker()">
        </div>
        <div id="seedPicker" class="picker muted">从玩家库勾选，或在下方粘贴 ID</div>
        <div class="row" style="margin-top:12px; align-items:flex-start;">
            <label style="margin-top:7px;">player_ids</label>
            <textarea id="f_roster" placeholder="多个 player_id 用逗号/分号/换行分隔"></textarea>
        </div>
        <div class="row" style="margin-top:10px;">
            <button onclick="saveRoster()">保存种子</button>
            <button class="ghost" onclick="loadRoster()">重新载入</button>
            <span class="muted">保存种子时会把这些人标进玩家库。</span>
        </div>
    </div>

    <h2>③ 采集 <span id="crawlTitle" class="muted"></span></h2>
    <div class="card">
        <div class="row">
            <button id="btnCrawl" onclick="startCrawl()">立即采集</button>
            <span id="crawlStatus" class="muted">选择杯赛后可采集</span>
            <span class="muted" style="flex:1"></span>
            <a class="link" id="lnkPublic" href="#" target="_blank">公开统计页</a>
        </div>
    </div>

    <h2>④ 比赛记录 <span id="matchTitle" class="muted"></span></h2>
    <div class="card">
        <div class="tabs">
            <button id="tabApproved" class="on" onclick="switchTab('approved')">已纳入</button>
            <button id="tabRejected" onclick="switchTab('rejected')">已剔除</button>
        </div>
        <div class="toolbar">
            <label class="muted">比赛日</label>
            <select id="dayFilter" onchange="renderMatches()"><option value="">全部</option></select>
            <button class="ghost" onclick="loadMatches()">刷新</button>
            <span class="muted" style="flex:1"></span>
            <button id="btnBulk" onclick="bulkAct()">剔除选中</button>
            <span class="muted">
                确认后可
                <a class="link" id="lnkJudge" href="#">计算冠军</a> ·
                <a class="link" id="lnkTitle" href="#">刷新称号</a>
            </span>
        </div>
        <table id="matchTable">
            <thead>
            <tr>
                <th><input type="checkbox" id="chkAll" onchange="toggleAll(this)"></th>
                <th>比赛日</th>
                <th>时间</th>
                <th>地图/模式</th>
                <th>对阵（比分）</th>
                <th>库内命中</th>
                <th>玩家（绿=库内）</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="matchEmpty" class="empty">暂无比赛</div>
    </div>
</div>
<div id="toast"></div>

<script>
    const AUTH = "{{ auth }}";
    let currentCup = null;
    let matchTab = 'approved';
    let matchData = [];
    let libraryPlayers = [];
    let crawlTimer = null;

    function api(path) {
        return fetch(path + (path.includes('?') ? '&' : '?') + 'auth=' + AUTH).then(r => r.json());
    }
    function toast(msg, ok) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.color = ok === false ? '#d89696' : '#6bd896';
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2200);
    }
    function pct(ratio) {
        if (ratio == null || ratio === '') return 60;
        const n = Number(ratio);
        return n <= 1 ? Math.round(n * 100) : Math.round(n);
    }

    function loadSeasons() {
        api('/api/admin/season/list').then(j => {
            const list = (j.data && j.data.seasons) || [];
            const tb = document.querySelector('#seasonTable tbody');
            tb.innerHTML = '';
            document.getElementById('seasonEmpty').style.display = list.length ? 'none' : 'block';
            list.forEach(s => {
                const tr = document.createElement('tr');
                if (s.cup_name === currentCup) tr.className = 'current';
                const crawl = s.crawl || {};
                tr.innerHTML = `
                    <td>${s.cup_name === currentCup ? '▶' : ''}</td>
                    <td>${s.cup_name}</td>
                    <td>${s.name || ''}</td>
                    <td><span class="tag ${s.match_type}">${s.match_type}</span></td>
                    <td>${s.start_date || ''} ~ ${s.end_date || ''}</td>
                    <td>${pct(s.hit_ratio)}%</td>
                    <td><span class="tag ${s.status}">${s.status}</span></td>
                    <td>${s.roster_count}</td>
                    <td>${s.approved_count || 0} / ${s.rejected_count || 0}</td>
                    <td class="actions">
                        <button class="ghost sm" onclick="selectCup('${s.cup_name}')">选为当前</button>
                        <button class="ghost sm" onclick='editSeason(${JSON.stringify(s)})'>编辑</button>
                    </td>`;
                tb.appendChild(tr);
                if (s.cup_name === currentCup) applyCrawlStatus(crawl);
            });
        });
    }
    function saveSeason() {
        const cup = document.getElementById('f_cup').value.trim();
        if (!cup) return toast('cup_name 不能为空', false);
        const p = new URLSearchParams({ auth: AUTH, cup,
            name: document.getElementById('f_name').value.trim(),
            match_type: document.getElementById('f_type').value,
            start_date: document.getElementById('f_start').value.trim(),
            end_date: document.getElementById('f_end').value.trim(),
            status: document.getElementById('f_status').value,
            hit_percent: document.getElementById('f_hit').value || '60' });
        fetch('/api/admin/season/save?' + p).then(r => r.json()).then(j => {
            toast((typeof j.data === 'string' && j.data) || j.message || '已保存', j.success !== false);
            if (j.success) { selectCup(cup); }
        });
    }
    function editSeason(s) {
        document.getElementById('f_cup').value = s.cup_name;
        document.getElementById('f_name').value = s.name || '';
        document.getElementById('f_type').value = s.match_type;
        document.getElementById('f_start').value = s.start_date || '';
        document.getElementById('f_end').value = s.end_date || '';
        document.getElementById('f_status').value = s.status;
        document.getElementById('f_hit').value = pct(s.hit_ratio);
        window.scrollTo(0, 0);
    }
    function clearSeasonForm() {
        ['f_cup','f_name','f_start','f_end'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('f_hit').value = 60;
    }
    function selectCup(cup) {
        currentCup = cup;
        document.getElementById('rosterTitle').textContent = '· ' + cup;
        document.getElementById('crawlTitle').textContent = '· ' + cup;
        document.getElementById('matchTitle').textContent = '· ' + cup;
        document.getElementById('lnkPublic').href = '/' + encodeURIComponent(cup) + '/';
        loadSeasons(); loadRoster(); loadLibrary(); loadMatches(); refreshCrawl();
    }

    function loadLibrary() {
        api('/api/admin/players?in_library=1').then(j => {
            libraryPlayers = (j.data && j.data.players) || [];
            renderSeedPicker();
        });
    }
    function renderSeedPicker() {
        const q = (document.getElementById('seedSearch').value || '').toLowerCase();
        const selected = new Set(_parseIds(document.getElementById('f_roster').value));
        const list = libraryPlayers.filter(p => {
            const blob = ((p.player_id || '') + (p.nickname || '') + (p.alias_name || '')).toLowerCase();
            return !q || blob.includes(q);
        });
        const el = document.getElementById('seedPicker');
        if (!list.length) { el.innerHTML = '<span class="muted">玩家库为空，请先去维护玩家，或直接粘贴 ID</span>'; return; }
        el.innerHTML = list.map(p => {
            const name = p.alias_name || p.nickname || p.player_id;
            const checked = selected.has(p.player_id) ? 'checked' : '';
            return `<label><input type="checkbox" data-pid="${p.player_id}" ${checked} onchange="syncSeedFromPicker()">
                <span>${name}</span> <span class="muted">(${p.player_id})</span></label>`;
        }).join('');
    }
    function filterSeedPicker() { renderSeedPicker(); }
    function syncSeedFromPicker() {
        const typed = _parseIds(document.getElementById('f_roster').value);
        const pickerIds = new Set([...document.querySelectorAll('#seedPicker input')].map(i => i.dataset.pid));
        const keptTyped = typed.filter(id => !pickerIds.has(id));
        const checked = [...document.querySelectorAll('#seedPicker input:checked')].map(i => i.dataset.pid);
        document.getElementById('f_roster').value = [...new Set([...keptTyped, ...checked])].join(', ');
    }
    function _parseIds(raw) {
        return (raw || '').split(/[,;\s]+/).map(s => s.trim()).filter(Boolean);
    }
    function loadRoster() {
        if (!currentCup) return;
        api('/api/admin/season/roster/get?cup=' + encodeURIComponent(currentCup)).then(j => {
            const roster = (j.data && j.data.roster) || [];
            const el = document.getElementById('rosterList');
            el.innerHTML = roster.length
                ? roster.map(r => `<span class="player in">${r.alias_name || r.nickname || r.player_id} <span class="muted">(${r.player_id})</span></span>`).join(' ')
                : '<span class="muted">种子为空</span>';
            document.getElementById('f_roster').value = roster.map(r => r.player_id).join(', ');
            renderSeedPicker();
        });
    }
    function saveRoster() {
        if (!currentCup) return toast('请先选择杯赛', false);
        const p = new URLSearchParams({ auth: AUTH, cup: currentCup,
            player_ids: document.getElementById('f_roster').value });
        fetch('/api/admin/season/roster/save?' + p).then(r => r.json()).then(j => {
            toast((typeof j.data === 'string' && j.data) || j.message || '已保存', j.success !== false); if (j.success) { loadRoster(); loadSeasons(); }
        });
    }

    function applyCrawlStatus(st) {
        const el = document.getElementById('crawlStatus');
        const btn = document.getElementById('btnCrawl');
        const state = (st && st.state) || 'idle';
        const running = !!(st && (st.running || state === 'running'));
        btn.disabled = running;
        el.className = 'status-' + (running ? 'running' : state);
        el.textContent = running ? (st.message || '采集中…') : (st && st.message ? st.message : '就绪');
        if (st && st.finished_at && !running) el.textContent += ' · ' + st.finished_at;
    }
    function refreshCrawl() {
        if (!currentCup) return;
        api('/api/admin/season/crawl/status?cup=' + encodeURIComponent(currentCup)).then(j => {
            applyCrawlStatus(j.data || {});
            const running = j.data && (j.data.running || j.data.state === 'running');
            if (running) {
                if (!crawlTimer) crawlTimer = setInterval(refreshCrawl, 4000);
            } else if (crawlTimer) {
                clearInterval(crawlTimer); crawlTimer = null;
                loadMatches(); loadSeasons();
            }
        });
    }
    function startCrawl() {
        if (!currentCup) return toast('请先选择杯赛', false);
        fetch('/api/admin/season/crawl?auth=' + AUTH + '&cup=' + encodeURIComponent(currentCup))
            .then(r => r.json()).then(j => {
                toast((typeof j.data === 'string' && j.data) || j.message || '已开始', j.success !== false);
                if (j.success) refreshCrawl();
            });
    }

    function switchTab(tab) {
        matchTab = tab;
        document.getElementById('tabApproved').className = tab === 'approved' ? 'on' : '';
        document.getElementById('tabRejected').className = tab === 'rejected' ? 'on' : '';
        document.getElementById('btnBulk').textContent = tab === 'approved' ? '剔除选中' : '恢复选中';
        document.getElementById('btnBulk').className = tab === 'approved' ? 'danger' : '';
        loadMatches();
    }
    function loadMatches() {
        if (!currentCup) return;
        api('/api/admin/selection/list?cup=' + encodeURIComponent(currentCup) + '&status=' + matchTab).then(j => {
            matchData = (j.data && j.data.list) || [];
            const days = [...new Set(matchData.map(m => m.play_day).filter(Boolean))].sort().reverse();
            const sel = document.getElementById('dayFilter');
            const cur = sel.value;
            sel.innerHTML = '<option value="">全部</option>' + days.map(d => `<option value="${d}">${d}</option>`).join('');
            if (days.includes(cur)) sel.value = cur;
            renderMatches();
        });
    }
    function renderMatches() {
        const day = document.getElementById('dayFilter').value;
        const list = matchData.filter(m => !day || m.play_day === day);
        const tb = document.querySelector('#matchTable tbody');
        tb.innerHTML = '';
        document.getElementById('matchEmpty').style.display = list.length ? 'none' : 'block';
        list.forEach(m => {
            const tr = document.createElement('tr');
            const players = (m.players || []).map(p =>
                `<span class="player ${p.in_library ? 'in' : ''}">${p.nickname || p.player_id}</span>`).join('');
            const act = matchTab === 'approved'
                ? `<button class="danger sm" onclick="act('reject',['${m.match_id}'])">剔除</button>`
                : `<button class="sm" onclick="act('approve',['${m.match_id}'])">恢复</button>`;
            tr.innerHTML = `
                <td><input type="checkbox" class="chk" data-mid="${m.match_id}"></td>
                <td>${m.play_day || ''}</td>
                <td class="muted">${(m.start_time || '').toString().slice(5,16)}</td>
                <td>${m.map_name || ''}<br><span class="muted">${m.game_mode || ''}</span></td>
                <td>${m.team1_name || ''} <b>${m.team1_score ?? ''}</b> : <b>${m.team2_score ?? ''}</b> ${m.team2_name || ''}</td>
                <td class="hit">${m.roster_hit_count}</td>
                <td style="max-width:300px;">${players}</td>
                <td class="actions">${act}</td>`;
            tb.appendChild(tr);
        });
        if (currentCup) {
            const d = day || '';
            document.getElementById('lnkJudge').href = `/api/admin/champion/judge?auth=${AUTH}&cup=${encodeURIComponent(currentCup)}&day=${d}`;
            document.getElementById('lnkTitle').href = `/api/admin/title/refresh?auth=${AUTH}&cup=${encodeURIComponent(currentCup)}&day=${d}`;
        }
    }
    function checkedIds() {
        return [...document.querySelectorAll('.chk:checked')].map(c => c.dataset.mid);
    }
    function toggleAll(el) {
        document.querySelectorAll('.chk').forEach(c => c.checked = el.checked);
    }
    function bulkAct() {
        const ids = checkedIds(); if (!ids.length) return toast('未勾选', false);
        act(matchTab === 'approved' ? 'reject' : 'approve', ids);
    }
    function act(type, ids) {
        if (!currentCup) return;
        const p = new URLSearchParams({ auth: AUTH, cup: currentCup, match_ids: ids.join(',') });
        fetch('/api/admin/selection/' + type + '?' + p).then(r => r.json()).then(j => {
            toast((typeof j.data === 'string' && j.data) || j.message || '完成', j.success !== false); if (j.success) { loadMatches(); loadSeasons(); }
        });
    }

    loadSeasons();
    loadLibrary();
</script>
</body>
</html>
