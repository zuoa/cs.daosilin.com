services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cs
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs -d cs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always

  app:
    image: ghcr.io/zuoa/cs.daosilin.com:main
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:5001/api/v1/meta', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://cs:cs@db:5432/cs
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-vane}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-vane1005}
      SITE_NAME: ${SITE_NAME:-熊掌CS Major}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-flash}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-45}
      PLAYER_SUMMARY_PROMPT_VERSION: ${PLAYER_SUMMARY_PROMPT_VERSION:-v1}
      BAIDU_BODY_API_KEY: ${BAIDU_BODY_API_KEY:-}
      BAIDU_BODY_SECRET_KEY: ${BAIDU_BODY_SECRET_KEY:-}
      PLAYER_PORTRAIT_STORAGE_PATH: /data/player-portraits
      WMPVP_ACCESS_TOKEN: ${WMPVP_ACCESS_TOKEN:-}
      WMPVP_STEAM_ID: ${WMPVP_STEAM_ID:-}
      PERFECT_RANK_REFRESH_HOURS: ${PERFECT_RANK_REFRESH_HOURS:-2,8,14,20}
      PERFECT_RANK_REQUEST_INTERVAL: ${PERFECT_RANK_REQUEST_INTERVAL:-0.2}
      DEMO_CREDENTIAL_ENCRYPTION_KEY: ${DEMO_CREDENTIAL_ENCRYPTION_KEY:-}
      DEMO_STORAGE_PATH: /data/demos

  demo-worker:
    image: ghcr.io/zuoa/cs.daosilin.com:main
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_healthy
    command: ["python", "demo_worker.py"]
    entrypoint: []
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://cs:cs@db:5432/cs
      REDIS_URL: redis://redis:6379/0
      WMPVP_ACCESS_TOKEN: ${WMPVP_ACCESS_TOKEN:-}
      WMPVP_STEAM_ID: ${WMPVP_STEAM_ID:-}
      DEMO_CREDENTIAL_ENCRYPTION_KEY: ${DEMO_CREDENTIAL_ENCRYPTION_KEY:-}
      DEMO_STORAGE_PATH: /data/demos

  player-summary-worker:
    image: ghcr.io/zuoa/cs.daosilin.com:main
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_healthy
    command: ["python", "player_summary_worker.py"]
    entrypoint: []
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://cs:cs@db:5432/cs
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-flash}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-45}
      PLAYER_SUMMARY_PROMPT_VERSION: ${PLAYER_SUMMARY_PROMPT_VERSION:-v1}

volumes:
  pgdata:
