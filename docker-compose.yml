services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cs
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs -d cs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always

  app:
    image: ghcr.io/zuoa/cs.daosilin.com:main
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5001:5001"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://cs:cs@db:5432/cs
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-vane}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-vane1005}
      SITE_NAME: ${SITE_NAME:-熊掌CS Major}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN:-}
      PERFECT_RANK_REFRESH_HOURS: ${PERFECT_RANK_REFRESH_HOURS:-2,8,14,20}
      PERFECT_RANK_REQUEST_INTERVAL: ${PERFECT_RANK_REQUEST_INTERVAL:-0.2}

volumes:
  pgdata:
